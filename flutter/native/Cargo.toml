[package]
name = "solosoul_core"
version = "0.1.0"
edition = "2021"
authors = ["SoloSoul"]
description = "SoloSoul Core - Rust Core Library for Flutter"

[dependencies]
# Encryption
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }

# Storage (rusqlite - SQLCipher removed for Android cross-compile)
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.8", features = ["v4", "serde"] }

# Hex encoding
hex = "0.4"

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Use rustls for reqwest to avoid OpenSSL on Android
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket
tokio-tungstenite = "0.21"

# CRDT (Yjs-compatible)
yrs = "0.19"

# Noise protocol (encrypted channels)
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# mDNS device discovery
mdns-sd = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SHA-256 for plugin handshake
sha2 = "0.10"

# Base64 encoding
base64 = "0.21"

# Flutter Rust Bridge
flutter_rust_bridge = "=2.12.0"

# Lazy static
lazy_static = "1.4"

# OCR: image processing (used on all platforms)
image = "0.25"
imageproc = "0.25"
ndarray = "0.17"
once_cell = "1.20"

# C-compatible FFI
libc = "0.2"

# Wasm (for plugin sandbox) - optional, excluded on iOS due to asm issues
wasmtime = { version = "21.0", optional = true }
wasmtime-wasi = { version = "21.0", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# ONNX Runtime only used on non-Windows platforms (link issues on Windows)
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }

[features]
default = ["sandbox"]
# Sandbox is opt-in due to wasmtime dependency issues on iOS
# Note: default enabled because FRB generated code references plugin module.
#       Platforms that cannot build wasmtime should use --no-default-features.
sandbox = ["dep:wasmtime", "dep:wasmtime-wasi"]

[lib]
name = "solosoul_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 'z'      # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Single codegen unit for better optimization
panic = 'unwind'      # Unwind on panic so FRB can catch and convert to Dart exceptions
strip = true          # Strip symbols (Rust 1.59+)
