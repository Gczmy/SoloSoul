[package]
name = "solosoul-cli"
version = "0.1.0"
edition = "2021"
authors = ["SoloSoul Team"]
license = "MIT"
repository = "https://github.com/Gczmy/SoloSoul"
description = "SoloSoul terminal CLI — local-first, zero-knowledge personal data vault."

[[bin]]
name = "solosoul"
path = "src/main.rs"

[dependencies]
# 共享核心库
solosoul-core = { path = "../tauri/crates/solosoul-core" }
solosoul-plugin = { path = "../tauri/crates/solosoul-plugin" }
solosoul-sync = { path = "../tauri/crates/solosoul-sync" }
solosoul-vault = { path = "../tauri/crates/solosoul-vault" }

# 命令行与 TUI
clap = { version = "4.5.23", features = ["derive"] }
ratatui = "0.30.1"
crossterm = "0.28.1"
inquire = { version = "0.7.5", features = ["date", "editor"] }
color-eyre = "0.6.3"

# 日志
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

# 序列化
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"

# 时间
chrono = { version = "0.4.39", features = ["serde"] }

# UUID 生成（动态字段组子字段 id）
uuid = { version = "1", features = ["v4"] }

# 安全内存清零
zeroize = "1.8"

# 系统 locale 检测（首次启动选择模板语言）
sys-locale = "0.3"

# 异步运行时 — /sync /ocr /embed_model /plugin_run 都需要后台常驻任务(SyncManager mDNS + TCP listener)
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "time", "sync"] }

# 错误处理
# 加密导出/导入
solosoul-crypto = { path = "../tauri/crates/solosoul-crypto" }
zip = "2"
# HTTP — /embed_model 从 SoloSoul/models registry 拉取模型清单与下载二进制
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# sha256 校验 embedding 模型下载完整性
sha2 = "0.10"

# 生成本地 sync node_id 与随机 NoiseKeys fallback (solosoul-sync 可选传递依赖，
# 这里声明为直接依赖以避免实现上的版本差异)
rand = "0.8"

# 国际化（fluent-rs）
fluent-bundle = "0.15"
unic-langid = "0.9"

[dev-dependencies]
tempfile = "3.14.0"
