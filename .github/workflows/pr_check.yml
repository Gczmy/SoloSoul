name: SoloSoul PR Checks

# Fast feedback for pull requests, including a production frontend smoke test (no installers).
on:
  pull_request:
    branches: [main]

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # 增量 IPC 契约独立检查：只编译纯 Rust 生成工具，不编译 Tauri Host。
  contract-check:
    name: Incremental IPC Contract Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract formatting dependencies
        run: npm ci --ignore-scripts

      # 顺序执行：生成器回归与漂移检查都使用同一个纯 Rust 工具。
      - name: Test contract generator
        run: npm run test:contracts

      - name: Check generated IPC contracts
        run: npm run check:contracts

      - name: Check ACL and incremental command coverage
        run: python3 scripts/check_acl_consistency.py

      - name: Test ACL contract comparison
        run: python3 -m unittest discover -s scripts -p test_check_acl_consistency.py

  frontend-check:
    name: Frontend TypeScript & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared frontend validation
        uses: ./.github/actions/check-frontend
        with:
          node_version: ${{ env.NODE_VERSION }}

  rust-check:
    name: Rust Format, Clippy & Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      # iOS/macOS的资源声明也在cargo check阶段验证；沿用真实构建和staging。
      - name: Setup Node for Apple check resources
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Apple frontend build dependencies
        working-directory: tauri
        run: npm ci

      - name: Build frontend assets for Apple checks
        working-directory: tauri
        run: npm run build

      # 仅Rust检查/单测的资源布局，无真实OCR模型，不能用于Release。
      - name: Prepare unit-test OCR resource layout
        working-directory: tauri
        run: |
          fixture_directory='src-tauri/resources/models/pp-ocr-v6-small'
          if [[ -e "$fixture_directory" || -L "$fixture_directory" ]]; then
            echo 'Expected a fresh unit-test resource directory; refusing to overwrite real models' >&2
            exit 1
          fi
          mkdir -p -- "$fixture_directory"
          printf '%s\n' 'CI unit-test resource layout only. No OCR model. Never package this fixture.' > "$fixture_directory/UNIT_TEST_FIXTURE.txt"

      - name: Prepare PDFium for Rust tests
        working-directory: tauri
        run: |
          bash scripts/download-pdfium.sh
          test -s src-tauri/resources/pdfium/libpdfium.dylib
          echo "PDFIUM_LIBRARY_PATH=$PWD/src-tauri/resources/pdfium/libpdfium.dylib" >> "$GITHUB_ENV"

      - name: Setup Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cargo check (iOS targets)
        run: |
          cd tauri
          # 两目标插件构建会改同一Swift依赖目录，按目标顺序编译。
          cargo check --target aarch64-apple-ios
          cargo check --target aarch64-apple-ios-sim

      # tauri-build优先读取通用声明；这里只同步Mac已启用feature，不改依赖图。
      - name: Align macOS check manifest with platform features
        working-directory: tauri
        run: |
          python3 - <<'PY'
          import copy
          import json
          import platform
          import re
          import sys
          import tomllib
          from pathlib import Path

          if platform.system() != "Darwin":
              raise SystemExit("macOS check manifest preparation requires Darwin")

          path = Path("src-tauri/Cargo.toml")
          config = json.loads(Path("src-tauri/tauri.macos.conf.json").read_text())
          if config.get("app", {}).get("macOSPrivateApi") is not True:
              raise SystemExit("Expected existing macOS private API configuration")

          source = path.read_text()
          manifest = tomllib.loads(source)
          common = manifest["dependencies"]["tauri"]
          mac = manifest["target"]['cfg(target_os = "macos")']["dependencies"]["tauri"]
          if common.get("version") != mac.get("version") or "macos-private-api" not in mac.get("features", []):
              raise SystemExit("Expected matching existing macOS tauri dependency")

          features = common.get("features", [])
          updated = list(dict.fromkeys([*features, "macos-private-api"]))
          if set(features) | set(mac["features"]) != set(updated) | set(mac["features"]):
              raise SystemExit("Preparation must preserve enabled macOS feature set")

          section = re.search(r"(?ms)^\[dependencies\]\n(.*?)(?=^\[|\Z)", source)
          if section is None:
              raise SystemExit("Expected general dependency section")
          match = re.search(r"(?m)^tauri = \{[^\n]*features = (\[[^\n]*?\])[^\n]*\}$", section[1])
          if match is None:
              raise SystemExit("Expected existing inline tauri feature declaration")
          start = section.start(1) + match.start(1)
          end = section.start(1) + match.end(1)
          prepared = source[:start] + json.dumps(updated) + source[end:]
          expected = copy.deepcopy(manifest)
          expected["dependencies"]["tauri"]["features"] = updated
          if tomllib.loads(prepared) != expected:
              raise SystemExit("Unexpected manifest change outside feature declaration")

          if prepared != source:
              path.write_text(prepared)
          print(f"Python {sys.version.split()[0]}: macOS check declaration aligned; enabled features unchanged")
          PY

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      # P041: future-keychain 门控模块（macos_keychain.rs）默认脱离编译面，
      # 在此加 feature 编译检查防腐化——长期不编译会腐化（接口漂移/不可编译）。
      - name: Check future-keychain feature compiles (macOS)
        run: |
          cd tauri
          cargo check -p solosoul-core --features future-keychain

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose

      - name: Check ACL consistency
        run: |
          cd tauri
          python3 scripts/check_acl_consistency.py

  plugin-market-check:
    name: Plugin Market Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule registry.json
        run: |
          cd SoloSoul_plugin_market
          python3 scripts/generate_registry.py
          if git diff --quiet registry.json; then
            echo "✅ Plugin market registry.json is up to date."
          else
            echo "❌ Plugin market registry.json is out of date!"
            git diff --stat registry.json
            exit 1
          fi

      - name: Check submodule pointer is clean
        run: |
          if git diff --quiet SoloSoul_plugin_market; then
            echo "✅ Submodule pointer is clean."
          else
            echo "❌ Submodule pointer has uncommitted changes."
            git diff SoloSoul_plugin_market
            exit 1
          fi

  cli-check:
    name: SoloSoul CLI (Rust Format, Clippy & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solosoul_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared cli validation
        uses: ./.github/actions/check-cli
        with:
          rust_version: ${{ env.RUST_VERSION }}
