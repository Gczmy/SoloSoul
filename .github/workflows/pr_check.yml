name: SoloSoul PR Checks

# Fast feedback for pull requests - no builds, just tests
on:
  pull_request:
    branches: [ master, main ]

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  frontend-check:
    name: Frontend TypeScript & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  rust-check:
    name: Rust Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose

  plugin-market-check:
    name: Plugin Market Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule registry.json
        run: |
          cd SoloSoul_plugin_market
          python3 scripts/generate_registry.py
          if git diff --quiet registry.json; then
            echo "✅ Plugin market registry.json is up to date."
          else
            echo "❌ Plugin market registry.json is out of date!"
            git diff --stat registry.json
            exit 1
          fi

      - name: Check submodule pointer is clean
        run: |
          if git diff --quiet SoloSoul_plugin_market; then
            echo "✅ Submodule pointer is clean."
          else
            echo "❌ Submodule pointer has uncommitted changes."
            git diff SoloSoul_plugin_market
            exit 1
          fi

  cli-check:
    name: SoloSoul CLI (Rust Format, Clippy & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solosoul_cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo (solosoul_cli)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solosoul_cli

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run CLI Tests
        run: cargo test --verbose --no-fail-fast
