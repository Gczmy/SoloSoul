name: SoloSoul PR Checks

# Fast feedback for pull requests - no builds, just tests
on:
  pull_request:
    branches: [ master, main ]

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  frontend-check:
    name: Frontend TypeScript & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  rust-check:
    name: Rust Format, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose
