name: SoloSoul PR Checks

# Fast feedback for pull requests, including a production frontend smoke test (no installers).
on:
  pull_request:
    branches: [main]

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # 增量 IPC 契约独立检查：只编译纯 Rust 生成工具，不编译 Tauri Host。
  contract-check:
    name: Incremental IPC Contract Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract formatting dependencies
        run: npm ci --ignore-scripts

      # 顺序执行：生成器回归与漂移检查都使用同一个纯 Rust 工具。
      - name: Test contract generator
        run: npm run test:contracts

      - name: Check generated IPC contracts
        run: npm run check:contracts

      - name: Check ACL and incremental command coverage
        run: python3 scripts/check_acl_consistency.py

      - name: Test ACL contract comparison
        run: python3 -m unittest discover -s scripts -p test_check_acl_consistency.py

  frontend-check:
    name: Frontend TypeScript & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared frontend validation
        uses: ./.github/actions/check-frontend
        with:
          node_version: ${{ env.NODE_VERSION }}

  rust-check:
    name: Rust Format, Clippy & Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Setup Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cargo check (iOS targets)
        run: |
          cd tauri
          # 两目标插件构建会改同一Swift依赖目录，按目标顺序编译。
          cargo check --target aarch64-apple-ios
          cargo check --target aarch64-apple-ios-sim

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      # P041: future-keychain 门控模块（macos_keychain.rs）默认脱离编译面，
      # 在此加 feature 编译检查防腐化——长期不编译会腐化（接口漂移/不可编译）。
      - name: Check future-keychain feature compiles (macOS)
        run: |
          cd tauri
          cargo check -p solosoul-core --features future-keychain

      - name: Prepare PDFium for Rust tests
        working-directory: tauri
        run: |
          bash scripts/download-pdfium.sh
          test -s src-tauri/resources/pdfium/libpdfium.dylib
          echo "PDFIUM_LIBRARY_PATH=$PWD/src-tauri/resources/pdfium/libpdfium.dylib" >> "$GITHUB_ENV"

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose

      - name: Check ACL consistency
        run: |
          cd tauri
          python3 scripts/check_acl_consistency.py

  plugin-market-check:
    name: Plugin Market Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule registry.json
        run: |
          cd SoloSoul_plugin_market
          python3 scripts/generate_registry.py
          if git diff --quiet registry.json; then
            echo "✅ Plugin market registry.json is up to date."
          else
            echo "❌ Plugin market registry.json is out of date!"
            git diff --stat registry.json
            exit 1
          fi

      - name: Check submodule pointer is clean
        run: |
          if git diff --quiet SoloSoul_plugin_market; then
            echo "✅ Submodule pointer is clean."
          else
            echo "❌ Submodule pointer has uncommitted changes."
            git diff SoloSoul_plugin_market
            exit 1
          fi

  cli-check:
    name: SoloSoul CLI (Rust Format, Clippy & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solosoul_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared cli validation
        uses: ./.github/actions/check-cli
        with:
          rust_version: ${{ env.RUST_VERSION }}
