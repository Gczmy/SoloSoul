name: SoloSoul CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # 增量 IPC 契约独立检查：只编译纯 Rust 生成工具，不编译 Tauri Host。
  contract-check:
    name: ${{ github.event_name == 'pull_request' && 'Incremental IPC Contract Check (delegated to PR Checks)' || 'Incremental IPC Contract Check' }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract formatting dependencies
        run: npm ci --ignore-scripts

      # 顺序执行：生成器回归与漂移检查都使用同一个纯 Rust 工具。
      - name: Test contract generator
        run: npm run test:contracts

      - name: Check generated IPC contracts
        run: npm run check:contracts

      - name: Check ACL and incremental command coverage
        run: python3 scripts/check_acl_consistency.py

      - name: Test ACL contract comparison
        run: python3 -m unittest discover -s scripts -p test_check_acl_consistency.py

  # ============================================================
  # Job 1: Frontend Checks (TypeScript, Lint, Unit Tests)
  # ============================================================
  frontend-check:
    name: ${{ github.event_name == 'pull_request' && 'Frontend Checks (delegated to PR Checks)' || 'Frontend Checks' }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared frontend validation
        uses: ./.github/actions/check-frontend
        with:
          node_version: ${{ env.NODE_VERSION }}

  # ============================================================
  # Job 2: Rust Checks & Tests
  # ============================================================
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install Linux Host development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          pkg-config --atleast-version=2.70 glib-2.0
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1

      # 仅用于Host静态检查/单测，不含真实OCR模型，不能用于Release。
      - name: Setup Node for resource staging
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # generate_context!在默认custom-protocol下需要真实frontendDist。
      - name: Install Host frontend build dependencies
        working-directory: tauri
        run: npm ci

      - name: Build frontend assets for Host checks
        working-directory: tauri
        run: npm run build

      - name: Stage desktop plugin resources for Host checks
        working-directory: tauri
        run: node scripts/stage-desktop-resources.cjs

      - name: Prepare unit-test OCR resource layout
        working-directory: tauri
        run: |
          fixture_directory='src-tauri/resources/models/pp-ocr-v6-small'
          if [[ -e "$fixture_directory" || -L "$fixture_directory" ]]; then
            echo 'Expected a fresh unit-test resource directory; refusing to overwrite real models' >&2
            exit 1
          fi
          mkdir -p -- "$fixture_directory"
          printf '%s\n' 'CI unit-test resource layout only. No OCR model. Never package this fixture.' > "$fixture_directory/UNIT_TEST_FIXTURE.txt"

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      - name: Prepare PDFium for Rust tests
        working-directory: tauri
        run: |
          bash scripts/download-pdfium.sh
          test -s src-tauri/resources/pdfium/libpdfium.so
          echo "PDFIUM_LIBRARY_PATH=$PWD/src-tauri/resources/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run Rust Tests
        run: |
          cd tauri
          # 只读记录sys-locale的四个输入，不覆盖真实语言环境。
          printf '%s\n' "LANGUAGE=${LANGUAGE-<unset>}" "LC_ALL=${LC_ALL-<unset>}" \
            "LC_MESSAGES=${LC_MESSAGES-<unset>}" "LANG=${LANG-<unset>}"
          locale
          cargo test --verbose

  # Windows Host 测试必须实际启动测试程序，不能由 Linux 测试或 Windows 打包代替。
  windows-rust-test:
    name: Windows Rust Regression Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # RF-1060：真实 Windows 回归，不能由 Ubuntu 上的专有用例跳过代替。
      - name: Run Node regression tests (Windows)
        run: npm run test:node

      # generate_context!在默认custom-protocol下需要真实frontendDist。
      - name: Install Host frontend build dependencies
        working-directory: tauri
        run: npm ci

      - name: Build frontend assets for Host checks
        working-directory: tauri
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Stage desktop plugin resources
        run: node scripts/stage-desktop-resources.cjs

      - name: Prepare Windows PDFium
        shell: bash
        run: |
          bash scripts/download-pdfium.sh
          node ../scripts/verify-windows-pdfium.mjs src-tauri/resources/pdfium/pdfium.dll

      # OCR 模型被 Git 忽略；此 job 只跑单测，不执行真实模型推理或打包。
      # Tauri 构建仍要求声明的资源目录存在，夹具不得用于 Release job。
      - name: Prepare unit-test OCR resource layout
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $PWD 'src-tauri/resources/models/pp-ocr-v6-small'
          if (Test-Path -LiteralPath $fixtureDirectory) {
            throw 'Expected a fresh unit-test resource directory; refusing to overwrite real models'
          }
          New-Item -ItemType Directory -Path $fixtureDirectory | Out-Null
          Set-Content -LiteralPath (Join-Path $fixtureDirectory 'UNIT_TEST_FIXTURE.txt') -Encoding utf8 -Value 'CI unit-test resource layout only. No OCR model. Never package this fixture.'

      - name: Run Windows Vault, core and Host tests
        shell: bash
        timeout-minutes: 90
        run: |
          mkdir -p ../rf309-logs
          export PDFIUM_LIBRARY_PATH="$(cygpath -w "$PWD/src-tauri/resources/pdfium/pdfium.dll")"
          set +e
          cargo test -p solosoul-vault -p solosoul-core --no-fail-fast 2>&1 | tee ../rf309-logs/core.log
          core_exit=${PIPESTATUS[0]}
          cargo test -p solo_soul --no-fail-fast 2>&1 | tee ../rf309-logs/host.log
          host_exit=${PIPESTATUS[0]}
          echo "Vault/core exit: $core_exit; Host exit: $host_exit"
          test "$core_exit" -eq 0 && test "$host_exit" -eq 0

      - name: Upload Windows Rust failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rust-test-logs
          path: rf309-logs/*.log
          if-no-files-found: warn

  # ============================================================
  # Job 2b: Plugin Market Registry Check
  # ============================================================
  plugin-market-check:
    name: ${{ github.event_name == 'pull_request' && 'Plugin Market Registry Check (delegated to PR Checks)' || 'Plugin Market Registry Check' }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule registry.json
        run: |
          cd SoloSoul_plugin_market
          python3 scripts/generate_registry.py
          if git diff --quiet registry.json; then
            echo "✅ Plugin market registry.json is up to date."
          else
            echo "❌ Plugin market registry.json is out of date!"
            git diff --stat registry.json
            exit 1
          fi

      - name: Check submodule pointer is clean
        run: |
          if git diff --quiet SoloSoul_plugin_market; then
            echo "✅ Submodule pointer is clean."
          else
            echo "❌ Submodule pointer has uncommitted changes."
            git diff SoloSoul_plugin_market
            exit 1
          fi

  # ============================================================
  # Job 3: SoloSoul CLI Checks
  # ============================================================
  cli-check:
    name: ${{ github.event_name == 'pull_request' && 'SoloSoul CLI (Rust Format, Clippy & Tests) (delegated to PR Checks)' || 'SoloSoul CLI (Rust Format, Clippy & Tests)' }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solosoul_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared cli validation
        uses: ./.github/actions/check-cli
        with:
          rust_version: ${{ env.RUST_VERSION }}

  # ============================================================
  # Job 4: Build macOS Release (master push only)
  # ============================================================
  build-macos:
    needs: [contract-check]
    name: Build macOS Release
    runs-on: macos-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Install create-dmg (for DMG bundle)
        run: brew install create-dmg

      # P041: future-keychain 门控模块（macos_keychain.rs）默认脱离编译面，
      # 在此加 feature 编译检查防腐化（对齐 pr_check.yml rust-check 任务）。
      - name: Check future-keychain feature compiles (macOS)
        run: cargo check -p solosoul-core --features future-keychain

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz*

  # ============================================================
  # Job 5: Build Windows Release (master push only)
  # ============================================================
  build-windows:
    needs: [contract-check]
    name: Build Windows Release
    runs-on: windows-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare Windows PDFium
        shell: bash
        run: |
          bash scripts/download-pdfium.sh
          node ../scripts/verify-windows-pdfium.mjs src-tauri/resources/pdfium/pdfium.dll

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/nsis/*.exe.sig

  # ============================================================
  # Job 6: Mobile E2E Smoke Tests (PR + master push)
  # ============================================================
  mobile-e2e-smoke:
    name: Mobile E2E Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if mobile files changed
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'tauri/src/**/*.{ts,tsx,css}'
              - 'tauri/e2e/**'
              - 'tauri/playwright.config.ts'
              - 'tauri/package*.json'
              - '.github/workflows/ci_cd.yml'

      - name: Skip if no mobile changes
        if: steps.changed.outputs.mobile != 'true'
        run: echo "No mobile-related changes, skipping mobile E2E tests."

      - name: Setup Node
        if: steps.changed.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.mobile == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.changed.outputs.mobile == 'true'
        run: npx playwright install chromium

      - name: Run mobile smoke E2E tests
        if: steps.changed.outputs.mobile == 'true'
        run: npx playwright test --project=mobile

      - name: Upload Playwright report on failure
        if: failure() && steps.changed.outputs.mobile == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-report
          path: |
            tauri/playwright-report/
            tauri/test-results/

  # ============================================================
  # Job 7: Create Release Draft (master push only, after builds)
  # ============================================================
  release:
    name: Create Release Draft
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build-macos, build-windows, windows-rust-test]
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/

      - name: Download Android release artifacts (from build-android.yml)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: solosoul-android-release
          path: release-artifacts/

      - name: Generate release tag
        id: tag
        run: |
          VERSION=$(jq -r '.version' tauri/src-tauri/tauri.conf.json 2>/dev/null || echo "0.0.0")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check release notes existence
        id: notes
        run: |
          NOTES="SoloSoul-Releases/release-notes-v${{ steps.tag.outputs.VERSION }}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> $GITHUB_OUTPUT
            echo "Found release notes: $NOTES"
          else
            echo "No release notes found for v${{ steps.tag.outputs.VERSION }}, creating release without body"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: SoloSoul v${{ steps.tag.outputs.VERSION }}
          body_path: ${{ steps.notes.outputs.path != '' && steps.notes.outputs.path || '' }}
          draft: true
          prerelease: false
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
