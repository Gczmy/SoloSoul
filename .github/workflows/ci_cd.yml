name: SoloSoul CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # Job 1: Frontend Checks (TypeScript, Lint, Unit Tests)
  # ============================================================
  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ============================================================
  # Job 2: Rust Checks & Tests
  # ============================================================
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose

  # ============================================================
  # Job 2b: Plugin Market Registry Check
  # ============================================================
  plugin-market-check:
    name: Plugin Market Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule registry.json
        run: |
          cd SoloSoul_plugin_market
          python3 scripts/generate_registry.py
          if git diff --quiet registry.json; then
            echo "✅ Plugin market registry.json is up to date."
          else
            echo "❌ Plugin market registry.json is out of date!"
            git diff --stat registry.json
            exit 1
          fi

      - name: Check submodule pointer is clean
        run: |
          if git diff --quiet SoloSoul_plugin_market; then
            echo "✅ Submodule pointer is clean."
          else
            echo "❌ Submodule pointer has uncommitted changes."
            git diff SoloSoul_plugin_market
            exit 1
          fi

  # ============================================================
  # Job 3: SoloSoul CLI Checks
  # ============================================================
  cli-check:
    name: SoloSoul CLI (Rust Format, Clippy & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solosoul_cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo (solosoul_cli)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solosoul_cli

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run CLI Tests
        run: cargo test --verbose --no-fail-fast

  # ============================================================
  # Job 4: Build macOS Release (master push only)
  # ============================================================
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Install create-dmg (for DMG bundle)
        run: brew install create-dmg

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz*

  # ============================================================
  # Job 5: Build Windows Release (master push only)
  # ============================================================
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/nsis/*.exe.sig

  # ============================================================
  # Job 6: Create Release Draft (master push only, after builds)
  # ============================================================
  release:
    name: Create Release Draft
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build-macos, build-windows, build-android-release]
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/

      - name: Download Android release artifacts
        uses: actions/download-artifact@v4
        with:
          name: solosoul-android-release
          path: release-artifacts/

      - name: Generate release tag
        id: tag
        run: |
          VERSION=$(jq -r '.version' tauri/src-tauri/tauri.conf.json 2>/dev/null || echo "0.0.0")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check release notes existence
        id: notes
        run: |
          NOTES="SoloSoul-Releases/release-notes-v${{ steps.tag.outputs.VERSION }}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> $GITHUB_OUTPUT
            echo "Found release notes: $NOTES"
          else
            echo "No release notes found for v${{ steps.tag.outputs.VERSION }}, creating release without body"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: SoloSoul v${{ steps.tag.outputs.VERSION }}
          body_path: ${{ steps.notes.outputs.path != '' && steps.notes.outputs.path || '' }}
          draft: true
          prerelease: false
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
