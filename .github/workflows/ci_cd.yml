name: SoloSoul CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # Job 1: Frontend Checks (TypeScript, Lint, Unit Tests)
  # ============================================================
  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ============================================================
  # Job 2: Rust Checks & Tests
  # ============================================================
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose

  # ============================================================
  # Job 3: macOS Release Build
  # Only runs on master/main push, not PRs
  # ============================================================
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    needs: [frontend-check, rust-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: |
          cd tauri
          npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Build Tauri App (macOS)
        run: |
          cd tauri
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ============================================================
  # Job 4: Windows Release Build
  # Only runs on master/main push, not PRs
  # ============================================================
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [frontend-check, rust-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: |
          cd tauri
          npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Build Tauri App (Windows)
        run: |
          cd tauri
          npm run tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ============================================================
  # Job 5: Create GitHub Release
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: artifacts/windows/

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            artifacts/macos/*.dmg
            artifacts/windows/*.exe
          body: |
            ## SoloSoul v${{ github.run_number }}

            **Automated Release** - CI Passed all tests.

            ### Downloads
            - 🍎 macOS: `SoloSoul-*.dmg`
            - 🪟 Windows: `SoloSoul-*.exe` (NSIS installer)

            ### Security Features
            - 🔒 Rust Symbol Stripping
            - 🔒 Source Code Obfuscation
            - 🔒 Self-Signed (no Apple notarization required)

            ### Test Results
            - ✅ Rust Unit Tests
            - ✅ Frontend TypeScript & Unit Tests

            ### What's New
            See [CHANGELOG](../blob/master/CHANGELOG.md) for details.

            Built from: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
