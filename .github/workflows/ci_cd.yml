name: SoloSoul CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  RUST_VERSION: 'stable'
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # Job 1: Frontend Checks (TypeScript, Lint, Unit Tests)
  # ============================================================
  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ============================================================
  # Job 2: Rust Checks & Tests
  # ============================================================
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Check formatting
        run: |
          cd tauri
          cargo fmt --check

      - name: Run Clippy
        run: |
          cd tauri
          cargo clippy -- -D warnings

      - name: Run Rust Tests
        run: |
          cd tauri
          cargo test --verbose

  # ============================================================
  # Job 2b: Plugin Market Registry Check
  # ============================================================
  plugin-market-check:
    name: Plugin Market Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate submodule registry.json
        run: |
          cd SoloSoul_plugin_market
          python3 scripts/generate_registry.py
          if git diff --quiet registry.json; then
            echo "✅ Plugin market registry.json is up to date."
          else
            echo "❌ Plugin market registry.json is out of date!"
            git diff --stat registry.json
            exit 1
          fi

      - name: Check submodule pointer is clean
        run: |
          if git diff --quiet SoloSoul_plugin_market; then
            echo "✅ Submodule pointer is clean."
          else
            echo "❌ Submodule pointer has uncommitted changes."
            git diff SoloSoul_plugin_market
            exit 1
          fi

  # ============================================================
  # Job 3: macOS Release Build
  # Only runs on master/main push, not PRs
  # ============================================================
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    needs: [frontend-check, rust-test, plugin-market-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: |
          cd tauri
          npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Build Tauri App (macOS)
        run: |
          cd tauri
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Sign DMG updater package
        run: |
          cd tauri
          DMG_PATH=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found" >&2
            exit 1
          fi
          npx tauri signer sign --password "" --private-key "$TAURI_SIGNING_PRIVATE_KEY" "$DMG_PATH"
          ls -la "$DMG_PATH" "$DMG_PATH.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/release/bundle/dmg/*.dmg.sig
          if-no-files-found: error

  # ============================================================
  # Job 4: Windows Release Build
  # Only runs on master/main push, not PRs
  # ============================================================
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [frontend-check, rust-test, plugin-market-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: |
          cd tauri
          npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Build Tauri App (Windows)
        run: |
          cd tauri
          npm run tauri build

      - name: Sign NSIS updater package
        shell: pwsh
        run: |
          cd tauri
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No NSIS installer found"
            exit 1
          }
          npx tauri signer sign --password "" --private-key "$env:TAURI_SIGNING_PRIVATE_KEY" "$exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe*
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            tauri/src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            tauri/src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
          if-no-files-found: error

  # ============================================================
  # Job 4b: Build SoloSoul CLI (macOS)
  # Only runs on master/main push, not PRs
  # ============================================================
  build-cli-macos:
    name: Build SoloSoul CLI (macOS)
    runs-on: macos-latest
    needs: [frontend-check, rust-test, plugin-market-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache CLI cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solosoul_cli

      - name: Build SoloSoul CLI (aarch64)
        run: |
          cd solosoul_cli
          cargo build --release --target aarch64-apple-darwin
          mkdir -p ../artifacts/cli/macos-aarch64
          cp target/aarch64-apple-darwin/release/solosoul ../artifacts/cli/macos-aarch64/
          ls -la ../artifacts/cli/macos-aarch64

      - name: Build SoloSoul CLI (x86_64)
        run: |
          cd solosoul_cli
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../artifacts/cli/macos-x86_64
          cp target/x86_64-apple-darwin/release/solosoul ../artifacts/cli/macos-x86_64/
          ls -la ../artifacts/cli/macos-x86_64

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-cli
          path: artifacts/cli/macos-*/
          if-no-files-found: error

  # ============================================================
  # Job 4c: Build SoloSoul CLI (Windows)
  # Only runs on master/main push, not PRs
  # ============================================================
  build-cli-windows:
    name: Build SoloSoul CLI (Windows)
    runs-on: windows-latest
    needs: [frontend-check, rust-test, plugin-market-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache CLI cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solosoul_cli

      - name: Build SoloSoul CLI
        shell: pwsh
        run: |
          cd solosoul_cli
          cargo build --release
          if (-not (Test-Path target/release/solosoul.exe)) { Write-Error "solosoul.exe not built"; exit 1 }
          New-Item -ItemType Directory -Force -Path ../artifacts/cli/windows | Out-Null
          Copy-Item target/release/solosoul.exe ../artifacts/cli/windows/
          Get-ChildItem ../artifacts/cli/windows

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: artifacts/cli/windows/
          if-no-files-found: error

  # ============================================================
  # Job 5: Create GitHub Release
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest    needs: [build-macos, build-windows, build-cli-macos, build-cli-windows]    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      - name: Install dependencies
        run: |
          cd tauri
          npm ci

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: artifacts/windows/

      - name: Download macOS CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-cli
          path: artifacts/cli/macos/

      - name: Download Windows CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-cli
          path: artifacts/cli/windows/

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./tauri/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        run: |
          mkdir -p artifacts/updater
          cp artifacts/macos/*.dmg artifacts/updater/ || true
          cp artifacts/macos/*.dmg.sig artifacts/updater/ || true
          cp artifacts/windows/*_x64-setup.exe artifacts/updater/ || true
          cp artifacts/windows/*_x64-setup.exe.sig artifacts/updater/ || true
          cd tauri
          node scripts/generate-latest-json.js \
            "${{ steps.version.outputs.version }}" \
            ../artifacts/updater \
            ../artifacts/updater/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          tag_name: v${{ steps.version.outputs.version }}
          name: SoloSoul v${{ steps.version.outputs.version }}
          files: |
            artifacts/macos/*.dmg
            artifacts/macos/*.dmg.sig
            artifacts/windows/*_x64-setup.exe
            artifacts/windows/*_x64-setup.exe.sig
            artifacts/updater/latest.json
            artifacts/cli/macos-aarch64/solosoul
            artifacts/cli/macos-x86_64/solosoul
            artifacts/cli/windows/solosoul.exe
          body: |
            ## SoloSoul v${{ steps.version.outputs.version }}

            **Automated Release** - CI Passed all tests.

            ### Downloads
            - 🍎 macOS App: `SoloSoul-*.dmg`
            - 🪟 Windows App: `SoloSoul-*.exe` (NSIS installer)
            - 🖥️ CLI (macOS arm64): `solosoul` (aarch64-apple-darwin) — *未公证,首次启动可能需右键打开*
            - 🖥️ CLI (macOS x86_64): `solosoul` (x86_64-apple-darwin) — *未公证*
            - 🖥️ CLI (Windows): `solosoul.exe`

            ### Auto Update
            This release includes `latest.json` and signed update packages for the in-app updater.

            ### Security Features
            - 🔒 Rust Symbol Stripping
            - 🔒 Source Code Obfuscation
            - 🔒 Self-Signed (no Apple notarization required)
            - 🔒 Ed25519 Signed Updates

            ### Test Results
            - ✅ Rust Unit Tests
            - ✅ Frontend TypeScript & Unit Tests

            ### What's New
            See [CHANGELOG](../blob/master/CHANGELOG.md) for details.

            Built from: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
