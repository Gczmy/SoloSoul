name: SoloSoul CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  # Flutter version - update as needed
  FLUTTER_VERSION: '3.41.6'
  RUST_VERSION: 'stable'

jobs:
  # ============================================================
  # Job 1: Rust Tests (fast, runs on Linux)
  # ============================================================
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: flutter/native

      - name: Run Rust Tests
        run: |
          cd flutter/native
          cargo test --verbose

  # ============================================================
  # Job 2: Dart Unit Tests
  # ============================================================
  dart-unit-test:
    name: Dart Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Run Dart Unit Tests
        run: |
          cd flutter
          flutter test test/unit/

  # ============================================================
  # Job 3: Widget Tests
  # ============================================================
  widget-test:
    name: Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Run Widget Tests
        run: |
          cd flutter
          flutter test test/widget/

  # ============================================================
  # Integration Tests Note:
  # Integration tests are skipped in CI because they require macOS code signing
  # which is not available on GitHub Actions runners.
  # Run locally with: cd flutter && flutter test integration_test/
  # ============================================================

  # ============================================================
  # Job 5: macOS Release Build
  # Only runs on master/main push, not PRs
  # ============================================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [rust-test, dart-unit-test, widget-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build Rust library
        run: |
          cd flutter/native
          cargo build --release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Copy Rust dylib to Frameworks
        run: |
          mkdir -p flutter/macos/Runner/Frameworks
          cp flutter/native/target/release/libsolosoul_core.dylib flutter/macos/Runner/Frameworks/

      - name: Build macOS Release (Obfuscated)
        env:
          FLUTTER_BUILD_ARGS: "--obfuscate --split-debug-info=./debug_info/macos"
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "0"
        run: |
          cd flutter
          flutter build macos --release $FLUTTER_BUILD_ARGS

      - name: Install create-dmg
        run: |
          which create-dmg || brew install create-dmg

      - name: Build DMG (Self-Signed)
        run: |
          cd flutter
          chmod +x ./build_dmg.sh
          ./build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: flutter/build/macos/*.dmg
          if-no-files-found: error

      - name: Upload debug info (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-macos
          path: flutter/debug_info/macos/
          if-no-files-found: warn

  # ============================================================
  # Job 6: Windows Release Build
  # Only runs on master/main push, not PRs
  # ============================================================
  build-windows:
    name: Build Windows ZIP
    runs-on: windows-latest
    needs: [rust-test, dart-unit-test, widget-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-wasip1

      - name: Build Rust library
        run: |
          cd flutter/native
          cargo build --release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter/.dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Build Windows ZIP
        shell: bash
        run: |
          cd flutter
          chmod +x ./build_windows_zip.sh
          ./build_windows_zip.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: flutter/build/windows/*.zip
          if-no-files-found: error

      - name: Upload debug info (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-windows
          path: flutter/debug_info/windows/
          if-no-files-found: warn

  # ============================================================
  # Job 7: Create GitHub Release & Push to Public Repo
  # Downloads artifacts from both platforms and releases together
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/windows/

      - name: Create Release Draft
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            artifacts/macos/*.dmg
            artifacts/windows/*.zip
          body: |
            ## SoloSoul v${{ github.run_number }}

            **Automated Release** - CI Passed all tests.

            ### Downloads
            - 🍎 macOS: `SoloSoul-*.dmg`
            - 🪟 Windows: `SoloSoul-*-windows-x64.zip`

            ### Security Features
            - 🔒 Rust Symbol Stripping (obfuscated function names)
            - 🔒 Dart Code Obfuscation
            - 🔒 Self-Signed (no Apple notarization required)

            ### Test Results
            - ✅ Rust Unit Tests
            - ✅ Dart Unit Tests
            - ✅ Widget Tests

            ### What's New
            See [CHANGELOG](../blob/master/CHANGELOG.md) for details.

            Built from: `${{ github.sha }}`
            Debug symbols: Available as workflow artifacts (not published)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Public Repo
        env:
          RELEASE_PAT: ${{ secrets.SOLOSOUL_RELEASE_PAT }}
        run: |
          # Only push if RELEASE_PAT is configured
          if [ -z "$RELEASE_PAT" ]; then
            echo "SOLOSOUL_RELEASE_PAT not configured, skipping push to public repo"
            exit 0
          fi
          # Clone the public repo
          git clone https://x-access-token:$RELEASE_PAT@github.com/Gczmy/SoloSoul.git ../SoloSoul-push

          # Copy release artifacts
          cp artifacts/macos/*.dmg ../SoloSoul-push/ 2>/dev/null || true
          cp artifacts/windows/*.zip ../SoloSoul-push/ 2>/dev/null || true

          # Copy updated changelog if exists
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md ../SoloSoul-push/
          fi

          # Commit and push
          cd ../SoloSoul-push
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${{ github.run_number }} from CI build ${{ github.run_id }}" || true
          git push
