name: Plugin Release

# 策略：本地预编译 + 预生成 registry.json → CI 仅验证一致性与按计划发布。
# 参考 AGENTS.md「插件市场子模块提交规则」章节。

on:
  push:
    branches: [master, main]
    paths: ['SoloSoul_plugin_market/**']

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Validate manifest.json files
        run: |
          cd SoloSoul_plugin_market
          pip install jsonschema
          for manifest in plugins/*/manifest.json examples/*/manifest.json; do
            echo "Validating $manifest"
            python3 -c "
              import json, jsonschema
              with open('SDK/schema/manifest.schema.json') as f:
                schema = json.load(f)
              with open('$manifest') as f:
                manifest = json.load(f)
              jsonschema.validate(manifest, schema)
            "
          done

      - name: Build plugins
        run: |
          cd SoloSoul_plugin_market
          for dir in plugins/*/ examples/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "Building $dir"
              cd "$dir"
              cargo build --target wasm32-wasip1 --release
              # 产物统一重命名为 plugin.wasm
              cp target/wasm32-wasip1/release/*.wasm plugin.wasm || true
              cd -
            fi
          done

      - name: Validate registry.json against built plugins
        run: |
          cd SoloSoul_plugin_market
          python3 << 'EOF'
          import hashlib, json, os, sys

          with open("registry.json") as f:
              registry = json.load(f)

          errors = []

          for plugin_id, entry in registry.get("plugins", {}).items():
              for version, ver_info in entry.get("versions", {}).items():
                  expected_sha = ver_info.get("sha256", "")
                  # Find matching plugins/ dir by looking for manifest with matching plugin_id + version
                  found = False
                  for plugin_dir in os.listdir("plugins"):
                      wasm_path = os.path.join("plugins", plugin_dir, "plugin.wasm")
                      manifest_path = os.path.join("plugins", plugin_dir, "manifest.json")
                      if not os.path.exists(wasm_path) or not os.path.exists(manifest_path):
                          continue
                      with open(manifest_path) as f:
                          m = json.load(f)
                      if m.get("plugin_id") == plugin_id and m.get("version") == version:
                          found = True
                          with open(wasm_path, "rb") as f:
                              actual_sha = hashlib.sha256(f.read()).hexdigest()
                          if actual_sha != expected_sha:
                              errors.append(
                                  f"SHA256 mismatch for {plugin_id} v{version}: "
                                  f"expected {expected_sha}, got {actual_sha}"
                              )

                  if not found:
                      # Plugin may not exist locally (e.g., published from another machine) — skip
                      print(f"Skipping {plugin_id} v{version}: not found in local plugins/")

          if errors:
              for e in errors:
                  print(f"❌ {e}")
              sys.exit(1)
          else:
              print("✅ All registry.json SHA-256 hashes match built plugins.")
          EOF

      - name: Upload to CDN (mock)
        run: |
          echo "TODO: Upload SoloSoul_plugin_market/plugins/ to S3/R2/CloudFront"
          echo "TODO: Upload SoloSoul_plugin_market/registry.json to CDN root"
          # aws s3 sync SoloSoul_plugin_market/plugins/ s3://plugins.solosoul.dev/
          # aws s3 cp SoloSoul_plugin_market/registry.json s3://plugins.solosoul.dev/registry.json
