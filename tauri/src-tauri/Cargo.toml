[package]
name = "solo_soul"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
opener = "0.7"

# Workspace crates
solosoul-crypto = { path = "../crates/solosoul-crypto" }
solosoul-vault = { path = "../crates/solosoul-vault" }
solosoul-sync = { path = "../crates/solosoul-sync" }
solosoul-core = { path = "../crates/solosoul-core" }
solosoul-plugin = { path = "../crates/solosoul-plugin" }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 异步
tokio = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# 时间
chrono = { workspace = true }

# 数据库
rusqlite = { workspace = true }

# 工具
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
mdns-sd = "0.11"
reqwest = { workspace = true }
once_cell = "1.20"
unicode-segmentation = "1.12"
futures = "0.3"

# 本地 Embedding (ONNX Runtime)
ort = { workspace = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = { workspace = true }
sys-locale = "0.3.2"

# 插件系统 (Wasmtime 沙箱 + Host Functions)
wasmtime = { version = "45.0.1", features = ["cranelift", "runtime", "component-model"] }
wasmtime-wasi = { version = "45.0.1", default-features = false, features = ["p1"] }
dirs = "6.0.0"
semver = "1.0"
url = "2.5"
minisign-verify = "0.2"
dark-light = "2.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std", "alloc"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSColor", "NSAppearance"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Globalization", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
ring = "0.17"
blake2 = "0.10"
wat = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# HTTP client (LLM proxy)
