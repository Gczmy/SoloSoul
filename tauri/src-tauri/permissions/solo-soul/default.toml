"$schema" = "../schemas/schema.json"

[default]
description = """
SoloSoul 应用默认权限集。

允许所有应用自定义 command（账户、Vault、对象、附件、搜索、设置等），
以及 Android 状态栏/导航栏样式控制。
"""
permissions = ["allow-all-custom-commands"]

[[permission]]
