<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Diagonal gradient: cool slate to warm clay (matches sidebar logo) -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7C99"/>
      <stop offset="100%" stop-color="#C4925C"/>
    </linearGradient>
    <!-- Subtle inner highlight -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded rectangle (border-radius 25%) -->
  <rect x="0" y="0" width="1024" height="1024" rx="256" ry="256"
        fill="url(#brandGradient)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="256" ry="256"
        fill="url(#innerHighlight)"/>

