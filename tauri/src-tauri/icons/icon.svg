<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Diagonal gradient: cool slate to warm clay (matches sidebar logo) -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7C99"/>
      <stop offset="100%" stop-color="#C4925C"/>
    </linearGradient>
    <!-- Subtle inner highlight -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded rectangle -->
  <rect x="0" y="0" width="1024" height="1024" rx="256" ry="256"
        fill="url(#brandGradient)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="256" ry="256"
        fill="url(#innerHighlight)"/>

  <!-- Shield icon — white, exactly centered, scaled to ~57% of canvas -->
  <g transform="matrix(0.907 0 0 -0.907 77 77)">
    <path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z" fill="white"/>
  </g>
</svg>
