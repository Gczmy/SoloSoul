<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Diagonal gradient: cool slate to warm clay (matches sidebar logo) -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B7C99"/>
      <stop offset="100%" stop-color="#C4925C"/>
    </linearGradient>
    <!-- Subtle inner highlight -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded rectangle -->
  <rect x="0" y="0" width="1024" height="1024" rx="256" ry="256"
        fill="url(#brandGradient)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="256" ry="256"
        fill="url(#innerHighlight)"/>

  <!-- S letter — exact Arial Bold glyph outline from fonttools, y-flipped for SVG -->
  <path d="M214 640 Q358 626 371 698 Q411 732 451 766 Q518 766 590 736 Q626 706 662 665 Q662 639 647 621 Q632 603 594 589 Q568 580 475 557 Q356 528 308 485 Q241 424 241 337 Q241 281 272 233 Q304 184 364 158 Q424 133 508 133 Q646 133 716 193 Q786 254 789 355 L641 361 Q632 305 600 280 Q569 255 507 255 Q442 255 406 282 Q382 299 382 327 Q382 353 404 372 Q432 395 540 421 Q648 446 700 474 Q752 501 781 548 Q810 595 810 665 Q810 728 775 783 Q740 838 676 865 Q612 891 517 891 Q378 891 303 827 Q229 763 214 640Z" fill="white" fill-opacity="0.95"/>
</svg>
