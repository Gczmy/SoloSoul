[workspace]
members = [
    "src-tauri",
    "crates/solosoul-crypto",
    "crates/solosoul-vault",
    "crates/solosoul-sync",
    "crates/solosoul-core",
    "crates/solosoul-plugin",
]
resolver = "2"

[workspace.package]
version = "2.11.2"
edition = "2021"
authors = ["SoloSoul Team"]
license = "MIT"
repository = "https://github.com/Gczmy/SoloSoul"

[workspace.dependencies]
# 密码学
argon2 = "0.5.3"
aes-gcm = "0.10.3"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"

# 数据库
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 异步
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 工具
uuid = { version = "1.10", features = ["v4", "serde"] }
subtle = "2.6"

# 本地推理（OCR / Embedding）
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
image = "0.25"
ndarray = "0.17"

# 测试
hex = "0.4"
base64 = "0.22"
tempfile = "3"

[profile.dev]
opt-level = 1
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
# P025: panic = "unwind"——abort 会让命令 handler 内 panic 直接杀死整个进程（跳过 Vault
# 正常锁定清理），且插件沙箱 sandbox.rs 的 catch_unwind 在 abort 下永远捕获不到插件 panic。
# unwind 下 tauri 将命令 panic 转为错误返回，插件 panic 由沙箱捕获，进程保持存活。
panic = "unwind"
codegen-units = 1
