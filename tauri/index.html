<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoloSoul</title>
    <script>
    /* Apply cached UI prefs before React/Vite load. Runs sync from localStorage. */
    try {
      var r = localStorage.getItem('solosoul_ui_prefs');
      if (r) {
        var p = JSON.parse(r), d = document.documentElement;
        if (p.theme) d.setAttribute('data-theme', p.theme === 'dark' ? 'dark' : p.theme === 'light' ? 'light' : 'system');
        var cs = {ocean:'#5B7C99',amber:'#C4925C',forest:'#5B8C6F',rose:'#B06B7A'};
        if (p.accentColor) d.style.setProperty('--accent-primary', cs[p.accentColor] || '#5B7C99');
      }
    } catch(e){}
    /* Detect system locale.
       Priority: 1) window.__SOLOSOUL_LOCALE__ (set by Rust eval before page load)
                 2) localStorage (may have been set by Rust eval or previous sessions)
                 3) navigator.language fallback */
    try {
      if (!localStorage.getItem('i18nextLng')) {
        var detected = 'en-US';
        if (window.__SOLOSOUL_LOCALE__ && (window.__SOLOSOUL_LOCALE__ === 'zh-CN' || window.__SOLOSOUL_LOCALE__ === 'en-US')) {
          detected = window.__SOLOSOUL_LOCALE__;
        } else {
          var nl = (navigator.language || navigator.userLanguage || 'en-US').toLowerCase();
          if (nl.startsWith('zh') || nl.startsWith('cmn')) { detected = 'zh-CN'; }
        }
        localStorage.setItem('i18nextLng', detected);
      }
    } catch(e){}
    </script>
    <style>
      /* Fallback to dark if no cache — prevents white flash. */
      html:not([data-theme]) { background: #1c1c1e; --bg-base: #1c1c1e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
