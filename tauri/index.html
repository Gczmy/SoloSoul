<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0"
    />
    <title>SoloSoul</title>
    <link rel="stylesheet" href="/src/styles/startup.css" />
    <script src="/startup.js"></script>
  </head>
  <body>
    <!-- 启动层独立于 React：模块下载、求值及 IPC 等待期间也有可见的品牌首帧。 -->
    <div id="startup-screen" role="status" aria-label="SoloSoul">
      <img class="startup-logo" src="/src-tauri/icons/icon.svg" width="80" height="80" alt="" />
      <div class="startup-name">SoloSoul</div>
      <div class="startup-status" aria-live="polite"></div>
      <div class="startup-actions" hidden>
        <button type="button" data-startup-retry>Restart</button>
        <button type="button" data-startup-diagnostics>Diagnostics</button>
      </div>
      <pre class="startup-diagnostics" hidden></pre>
      <noscript>SoloSoul requires JavaScript to start.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
