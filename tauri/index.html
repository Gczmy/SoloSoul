<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoloSoul</title>
    <script>
    /* Apply cached UI prefs before React/Vite load. Runs sync from localStorage. */
    try {
      var r = localStorage.getItem('solosoul_ui_prefs');
      if (r) {
        var p = JSON.parse(r), d = document.documentElement;
        if (p.theme) d.setAttribute('data-theme', p.theme === 'dark' ? 'dark' : p.theme === 'light' ? 'light' : 'system');
        var cs = {ocean:'#5B7C99',amber:'#C4925C',forest:'#5B8C6F',rose:'#B06B7A'};
        if (p.accentColor) d.style.setProperty('--accent-primary', cs[p.accentColor] || '#5B7C99');
      }
    } catch(e){}
    /* Debug: log locale detection to console. */
    try {
      console.log('[i18n] html-inline: __SOLOSOUL_LOCALE__=', window.__SOLOSOUL_LOCALE__, 'navigator.language=', navigator.language, 'navigator.userLanguage=', navigator.userLanguage);
      var lsVal = localStorage.getItem('i18nextLng');
      console.log('[i18n] html-inline: localStorage i18nextLng=', lsVal);
      if (!lsVal) {
        var detected = 'en-US';
        if (window.__SOLOSOUL_LOCALE__ && (window.__SOLOSOUL_LOCALE__ === 'zh-CN' || window.__SOLOSOUL_LOCALE__ === 'en-US')) {
          detected = window.__SOLOSOUL_LOCALE__;
          console.log('[i18n] html-inline: using __SOLOSOUL_LOCALE__:', detected);
        } else {
          var nl = (navigator.language || navigator.userLanguage || 'en-US').toLowerCase();
          if (nl.startsWith('zh') || nl.startsWith('cmn')) { detected = 'zh-CN'; }
          console.log('[i18n] html-inline: using navigator fallback:', detected, '(from', nl, ')');
        }
        localStorage.setItem('i18nextLng', detected);
        console.log('[i18n] html-inline: set localStorage i18nextLng=', detected);
      }
    } catch(e){ console.error('[i18n] html-inline error:', e); }
    </script>
    <style>
      /* Fallback to dark if no cache — prevents white flash. */
      html:not([data-theme]) { background: #1c1c1e; --bg-base: #1c1c1e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
