[package]
name = "solosoul-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
uuid = { workspace = true }
solosoul-vault = { path = "../solosoul-vault" }
# 需要 solosoul_core::VaultService 复用 GUI + CLI 账户生命周期逻辑
# P024: 仅用 vault_service/path_util，关闭默认媒体 features（不再拖入 ort/pdfium-render/image 等重依赖）
solosoul-core = { path = "../solosoul-core", default-features = false }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# Random
rand = { workspace = true }

# 敏感内存安全清零（P015：恢复密码 Zeroizing）
zeroize = { workspace = true }

# Local IP discovery for recovery host display address
local-ip-address = "0.6"

# Encoding
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

# Noise 加密传输（全平台）。mDNS 仅桌面端，移动端二期替换为 Android NSD / iOS Bonjour。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mdns-sd = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.snow]
version = "0.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.x25519-dalek]
version = "2"
features = ["static_secrets"]

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
snow = { version = "0.9", features = ["default"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = { workspace = true }
# service.rs 中的 #[tokio::test] 需要 macros feature
tokio = { workspace = true, features = ["macros", "rt"] }
