[package]
name = "solosoul-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core logic for SoloSoul GUI and CLI (vault lifecycle, templates, biometric primitives)."

[dependencies]
# Workspace crates
solosoul-crypto = { path = "../solosoul-crypto" }
solosoul-vault = { path = "../solosoul-vault" }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 时间
chrono = { workspace = true }

# 工具
uuid = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
tokio = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }

# 日志
tracing = { workspace = true }

# 生物识别凭证存储
# macOS 使用 Security.framework + Keychain UserPresence；其他平台使用占位实现。

# 随机数生成
rand = { workspace = true }
sha2 = { workspace = true }

# 进程级文件锁
fs2 = "0.4.3"

# 本地 OCR（PP-OCRv6 ONNX）
ort = { workspace = true }
image = { workspace = true }
ndarray = { workspace = true }

# MRZ 模板匹配（字符渲染）
ab_glyph = "0.2"
pdf-extract = "0.10.0"
pdfium-render = "0.9.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std", "alloc"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
