[package]
name = "solosoul-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core logic for SoloSoul GUI and CLI (vault lifecycle, templates, biometric primitives)."

[features]
# P134: 未来 macOS Keychain UserPresence 生物识别方案（规划代码门控）。
# 默认关闭——团队未加入 Apple Developer Program 前不编译该模块（脱离默认编译面），
# 启用需同时满足：加入 Apple Developer Program + Developer ID 签名 +
# entitlements 声明 keychain-access-groups（详见 biometric/macos_keychain.rs 顶部注释）。
# 启用方式：solosoul-core 的 consumers 声明 features = ["future-keychain"]。
future-keychain = []

# P024: 媒体重依赖（OCR / PDFium / 水印）feature 门控——仅真正需要的消费者才编译。
# - 默认全开（src-tauri 不变，保持全部媒体能力）；
# - solosoul-sync 声明 `default-features = false`（仅用 vault_service/path_util，
#   不再拖入 ort/pdfium-render/image 等重依赖栈）；
# - solosoul-plugin 声明 `default-features = false, features = ["watermark"]`
#   （仅水印宿主功能，避开 OCR/PDF 模块与 ort/ndarray）。
default = ["ocr", "pdf", "watermark"]
ocr = ["dep:ort", "dep:image", "dep:ndarray"]
pdf = ["dep:pdfium-render"]
watermark = ["dep:image", "dep:pdfium-render", "dep:ab_glyph", "pdf"]

[dependencies]
# Workspace crates
solosoul-crypto = { path = "../solosoul-crypto" }
solosoul-vault = { path = "../solosoul-vault" }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }

# 时间
chrono = { workspace = true }

# 工具
uuid = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
base64 = { workspace = true }
zeroize = { workspace = true }

# 日志
tracing = { workspace = true }

# 生物识别凭证存储
# macOS 使用 Security.framework + Keychain UserPresence；其他平台使用占位实现。

# 随机数生成
sha2 = { workspace = true }

# 加密导出/导入 ZIP 包
zip = { version = "2", default-features = false, features = ["deflate"] }

# P026: 导入导出流式化使用（通用代码路径，非桌面专属——Android 交叉编译同样需要）
tempfile.workspace = true

# 桌面端专属依赖：进程锁 / OCR / MRZ / PDFium（P024: 媒体重依赖全部 optional，由 features 门控）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
fs2 = "0.4.3"
ort = { workspace = true, optional = true }
image = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
ab_glyph = { version = "0.2", optional = true }
pdfium-render = { version = "0.9.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
dirs = "6.0"
objc2 = { version = "0.6", default-features = false, features = ["std", "alloc"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = { version = "3" }
security-framework-sys = "2.17"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# P002: 新增 Win32_Security_Cryptography（DPAPI CryptProtectData/UnprotectData）特性；
# LocalFree/HLOCAL 位于 Foundation（已启用），无需额外 feature。
windows = { version = "0.58", features = ["Security_Credentials_UI", "Foundation", "Win32_System_Com", "Win32_Security_Cryptography"] }
