[package]
name = "solosoul-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared core logic for SoloSoul GUI and CLI (vault lifecycle, templates, biometric primitives)."

[dependencies]
# Workspace crates
solosoul-crypto = { path = "../solosoul-crypto" }
solosoul-vault = { path = "../solosoul-vault" }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 时间
chrono = { workspace = true }

# 工具
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }

# 日志
tracing = { workspace = true }

# 生物识别凭证存储
keyring = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std", "alloc"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }
