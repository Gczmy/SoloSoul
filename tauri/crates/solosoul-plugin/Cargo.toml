[package]
name = "solosoul-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SoloSoul plugin runtime — Wasm-based plugin execution engine"

[lib]
name = "solosoul_plugin"
path = "src/mod.rs"

[dependencies]
# Internal
solosoul-vault = { path = "../solosoul-vault" }
# P024: 仅水印宿主功能需要 core 的 watermark 模块，关闭 OCR/PDF 默认 features（避开 ort/ndarray 重依赖）
solosoul-core = { path = "../solosoul-core", default-features = false, features = ["watermark"] }

# HTTP
reqwest = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors
thiserror = { workspace = true }

# Time
chrono = { workspace = true }

# URL parsing
url = "2.5"

# Version comparison
semver = "1.0"

# Signature verification
minisign-verify = "0.2"

# System locale
sys-locale = "0.3.2"

# Platform directories
dirs = "6.0"



# Tracing
tracing = { workspace = true }

# UUID
uuid = { workspace = true }

# SHA
sha2 = { workspace = true }
hex = { workspace = true }

# Wasm runtime — 全平台支持
# 注：`async` 不可移除——wasmtime 45 的 default features 已含 async，且 wasmtime-wasi
# 的 p1 feature 传递依赖 wasmtime/async（sandbox.rs 使用 p1::add_to_linker_sync），
# 即使 default-features=false 也会被重新拉起。`pulley` 为移动端 sandbox pulley64
# target 必需、非默认；`cranelift` 为桌面 JIT（默认已含，显式声明保持自文档化）。
wasmtime = { version = "45.0.1", features = ["async", "cranelift", "pulley"] }
wasmtime-wasi = { version = "45.0.1", features = ["p1"] }

[dev-dependencies]
tempfile = { workspace = true }
