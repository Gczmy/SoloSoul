[package]
name = "solosoul-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SoloSoul plugin runtime — Wasm-based plugin execution engine"

[lib]
name = "solosoul_plugin"
path = "src/mod.rs"

[dependencies]
# Internal
solosoul-vault = { path = "../solosoul-vault" }
solosoul-core = { path = "../solosoul-core" }

# HTTP
reqwest = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors
thiserror = { workspace = true }

# Time
chrono = { workspace = true }

# URL parsing
url = "2.5"

# Version comparison
semver = "1.0"

# Signature verification
minisign-verify = "0.2"

# System locale
sys-locale = "0.3.2"

# Platform directories
dirs = "6.0"



# Tracing
tracing = { workspace = true }

# UUID
uuid = { workspace = true }

# SHA
sha2 = { workspace = true }
hex = { workspace = true }

# Wasm runtime — 全平台支持
wasmtime = { version = "45.0.1", features = ["async", "cranelift", "pulley"] }
wasmtime-wasi = { version = "45.0.1", features = ["p1"] }

[dev-dependencies]
tempfile = { workspace = true }
